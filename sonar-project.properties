# SonarQube — Mass Online (paginaweb)
# El estudiante ejecuta sonar-scanner; este archivo solo configura el análisis.
# Generar reportes antes: scripts\prepare-sonar.bat  (o composer test:coverage)

sonar.projectKey=Pagina_Web_V2
sonar.projectName=Pagina_Web_V2
sonar.projectVersion=1.1

# --- Servidor Local ---
sonar.host.url=http://localhost:9000

# --- Fuentes (producción vigente) ---
# backend/ y frontend/ son el código actual. includes/, admin/ y cliente_interfaces/
# siguen siendo puntos de entrada y lógica en uso.
sonar.sources=includes,backend,frontend,admin,cliente_interfaces,index.php,logout.php
sonar.sourceEncoding=UTF-8

# --- Pruebas (no son código de producción) ---
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php

# --- Exclusiones de análisis como código fuente de producción ---
# tests/ no entra en sonar.sources: se importa solo como pruebas.
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/docs/**,\
  **/.phpunit.cache/**,\
  **/frontend/assets/img/**

# --- Cobertura PHP (Clover vía PHPUnit + PCOV) ---
# Los tests no cuentan como código productivo. Las vistas y el JS sí entran en el denominador.
sonar.php.coverage.reportPaths=docs/pruebas/evidencias/coverage/clover.xml
sonar.coverage.exclusions=\
  **/tests/**,\
  **/vendor/**,\
  **/docs/**

# --- Ejecución de pruebas (JUnit) ---
sonar.php.tests.reportPath=docs/pruebas/evidencias/junit.xml
