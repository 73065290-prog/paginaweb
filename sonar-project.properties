# SonarQube — Mass Online (paginaweb)
# El estudiante ejecuta sonar-scanner; este archivo solo configura el análisis.

sonar.projectKey=mass-paginaweb
sonar.projectName=Mass Online Tiendas Mass
sonar.projectVersion=1.0

# Fuentes y pruebas
sonar.sources=includes,admin,cliente_interfaces,assets/js
sonar.tests=tests
sonar.language=php

# Exclusiones (vendor, evidencias, cachés, assets estáticos pesados)
sonar.exclusions=**/vendor/**,**/node_modules/**,**/docs/pruebas/evidencias/**,**/.phpunit.cache/**,**/assets/css/**,**/assets/img/**

# Tests: excluir del análisis de bugs de producción
sonar.test.exclusions=**/tests/**

# Cobertura PHP (Clover generado por PHPUnit+PCOV)
sonar.php.coverage.reportPaths=docs/pruebas/evidencias/coverage/clover.xml

# Reporte JUnit de pruebas
sonar.php.tests.reportPath=docs/pruebas/evidencias/junit.xml

# Encoding
sonar.sourceEncoding=UTF-8
