# SonarQube — Mass Online (paginaweb)
# El estudiante ejecuta sonar-scanner; este archivo solo configura el análisis.
# Generar reportes antes: scripts\prepare-sonar.bat  (o composer test:coverage)

sonar.projectKey=mass-paginaweb
sonar.projectName=Mass Online Tiendas Mass
sonar.projectVersion=1.1

# --- Fuentes (producción) ---
sonar.sources=includes,admin,cliente_interfaces,assets/js,index.php,logout.php
sonar.sourceEncoding=UTF-8

# --- Pruebas ---
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php

# --- Exclusiones de análisis de código fuente ---
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/docs/**,\
  **/.phpunit.cache/**,\
  **/assets/css/**,\
  **/assets/img/**,\
  **/scripts/**

# Layouts/partials de presentación: menos valor en Quality Gate académico
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/includes/data.php

# --- Cobertura PHP (Clover vía PHPUnit + PCOV) ---
sonar.php.coverage.reportPaths=docs/pruebas/evidencias/coverage/clover.xml
sonar.coverage.exclusions=\
  **/includes/admin/**,\
  **/includes/components/**,\
  **/includes/layouts/**,\
  **/assets/js/**

# --- Ejecución de pruebas (JUnit) ---
sonar.php.tests.reportPath=docs/pruebas/evidencias/junit.xml
